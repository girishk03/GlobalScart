services:
  postgres:
    image: postgres:16
    container_name: globalcart_postgres
    environment:
      POSTGRES_USER: globalcart
      POSTGRES_PASSWORD: globalcart
      POSTGRES_DB: globalcart
    ports:
      - "5432:5432"
    volumes:
      - globalcart_pgdata:/var/lib/postgresql/data

  mssql:
    image: mcr.microsoft.com/mssql/server:2022-latest
    container_name: globalcart_mssql
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "Globalcart_password123!"
      MSSQL_PID: "Developer"
    ports:
      - "1433:1433"

volumes:
  globalcart_pgdata:
