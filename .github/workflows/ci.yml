name: CI Pipeline

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: globalcart
          POSTGRES_PASSWORD: globalcart
          POSTGRES_DB: globalcart
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Java 17 (for PySpark)
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Set up Python 3.13
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
          pip install pyspark==4.2.0 google-cloud-bigquery pyarrow apache-airflow==3.3.1 psycopg2-binary

      - name: Setup environment variables
        run: cp .env.example .env

      - name: Initialize Database and Generate Mock Data
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: globalcart
          PGUSER: globalcart
          PGPASSWORD: globalcart
        run: |
          python -m src.pipeline --scale small --truncate
          python -m src.run_sql --sql sql/07_app_auth.sql
          python -m src.run_sql --sql sql/08_add_order_address.sql
          python -m src.run_sql --sql sql/09_customer_addresses.sql
          python -m src.run_sql --sql sql/10_shop_features.sql
          python -m src.run_sql --sql sql/11_razorpay.sql
          python -m src.run_sql --sql sql/12_inventory.sql
          python -m src.run_sql --sql sql/13_observability.sql

      - name: Extract PostgreSQL transactional tables to Raw landing zone
        env:
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: globalcart
          PGUSER: globalcart
          PGPASSWORD: globalcart
        run: |
          python data_platform/ingestion/postgres_extractor.py

      - name: Run Backend Unit Tests
        env:
          PYTHONPATH: .
          PGHOST: localhost
          PGPORT: 5432
          PGDATABASE: globalcart
          PGUSER: globalcart
          PGPASSWORD: globalcart
        run: |
          pytest tests/

      - name: Validate Raw Landing Zone Data Quality
        run: |
          python data_platform/validation/data_quality.py

      - name: Run PySpark Star Schema Transformation
        run: |
          python data_platform/spark/transform_ecommerce.py

      - name: Run PySpark Validation Suite
        run: |
          python data_platform/spark/spark_validation.py

      - name: Run Airflow DAG Compile and Import Check
        run: |
          export AIRFLOW_HOME=$PWD/data_platform/airflow
          python data_platform/airflow/dags/globalcart_pipeline.py

      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3
        with:
          terraform_version: 1.5.7

      - name: Terraform Format and Validate Check
        run: |
          cd infrastructure/terraform
          terraform init -backend=false
          terraform fmt -check
          terraform validate

      - name: Docker Build Check
        run: |
          docker build -t globalcart-app:latest .
